; AQSMS ESP32 firmware -- PlatformIO project.
;
; Target board: ESP32 DevKitC (WROOM-32). See ESP32_TO_PI_SETUP.md.
;
; Build:   pio run
; Upload:  pio run --target upload
; Monitor: pio device monitor
;
; Dependencies: the ESP32 Arduino core only. JSON is written by hand with
; snprintf, and responses are checked by HTTP status, so there is no library
; to fetch beyond the platform itself.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; -Wall surfaces the usual C mistakes. Not -Werror: a warning in a vendor
; header should not stop a field build.
build_flags =
    -Wall

; Serial output only while bring-up is in progress. Once the pond is running
; unattended, set this to 1 to silence routine logging.
build_unflags =
